# Blueprint do Render — sobe a API, o PostgreSQL e o Redis de uma vez.
#
# Como usar:
#   1. Render Dashboard → New → Blueprint
#   2. Aponte para este repositório
#   3. Preencha FRONTEND_URL depois que o frontend estiver na Vercel
#
# O `JWT_SECRET` é gerado automaticamente pelo Render (generateValue) — não
# existe segredo neste arquivo.

databases:
  - name: casa-financeira-db
    databaseName: casa_financeira
    user: casa_financeira
    plan: free
    postgresMajorVersion: '16'

services:
  # ==================== API ====================
  - type: web
    name: casa-financeira-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    # `--include=dev` é obrigatório: com NODE_ENV=production (declarado abaixo),
    # o npm pula as devDependencies — e o `nest`, que compila o projeto, é uma
    # delas. Sem isso o build falha com "nest: not found".
    buildCommand: npm ci --include=dev && npm run build
    # As migrations rodam ANTES de subir a aplicação: um deploy com o código
    # novo e o schema antigo quebra em runtime, não no build.
    startCommand: npm run deploy:start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # O Render injeta PORT automaticamente; main.ts já a respeita.

      - key: DATABASE_URL
        fromDatabase:
          name: casa-financeira-db
          property: connectionString

      # O PostgreSQL gerenciado do Render exige TLS.
      - key: DB_SSL
        value: 'true'

      - key: REDIS_URL
        fromService:
          type: redis
          name: casa-financeira-redis
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRATION
        value: 7d

      # Preencha com a URL da Vercel após o deploy do frontend.
      # Aceita lista separada por vírgula (útil para as URLs de preview).
      - key: FRONTEND_URL
        sync: false

      # ENVIO DE E-MAIL — necessário para os LEMBRETES DE VENCIMENTO chegarem.
      #
      # Sem envio configurado o sistema continua funcionando e os avisos
      # aparecem dentro da aplicação, mas nenhum e-mail é entregue. O registro
      # fica marcado como falha com o motivo — nunca como "enviado".
      #
      # >>> NÃO USE SMTP NO PLANO GRATUITO. <<<
      # Desde 26/09/2025 o Render BLOQUEIA tráfego de saída nas portas 25, 465
      # e 587 em serviços gratuitos. Qualquer tentativa por SMTP morre em
      # "Connection timeout" — foi assim que o primeiro envio real falhou.
      #
      # O caminho que funciona é uma API HTTP (porta 443). BREVO_API_KEY tem
      # precedência sobre o SMTP quando as duas estiverem definidas:
      #   BREVO_API_KEY = chave criada em app.brevo.com (SMTP & API → API keys)
      #   EMAIL_FROM    = Controle Financeiro da Casa <remetente@verificado>
      # O remetente precisa estar VERIFICADO no Brevo, senão a API recusa.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # SMTP: só para desenvolvimento local ou se o serviço migrar para um
      # plano pago, onde as portas deixam de ser bloqueadas.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

      # Segredo do disparo externo dos lembretes.
      #
      # POR QUE ELE EXISTE: no plano gratuito o serviço HIBERNA após ~15 min sem
      # tráfego, e o agendador interno (@Cron às 10h e 19h) não dispara com o
      # processo dormindo. Um agendador externo gratuito chama
      # `POST /reminders/dispatch` nos dois horários, acordando o serviço.
      #
      # Sem esta variável a rota recusa qualquer chamada — deixá-la aberta
      # permitiria que qualquer um disparasse e-mails para a casa.
      - key: REMINDER_DISPATCH_TOKEN
        generateValue: true

  # ==================== Redis (filas do Bull) ====================
  - type: redis
    name: casa-financeira-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []
